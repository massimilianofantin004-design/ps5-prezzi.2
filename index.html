<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>PS5 Prezzi: il prezzo migliore, sempre aggiornato</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14213d;--muted:#5b6678;--line:#d9dfe8;--best:#0a7d4f;--bestbg:#e3f5ec;--accent:#1f4fd8}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--card:#162033;--ink:#eef2fa;--muted:#9aa7bd;--line:#26334b;--best:#5fd3a0;--bestbg:#12382b;--accent:#7da2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:#14213d;color:#fff;padding:calc(28px + env(safe-area-inset-top)) 16px 24px}
.wrap{max-width:640px;margin:0 auto}
h1{margin:0 0 6px;font-size:clamp(26px,7vw,38px);line-height:1.1;letter-spacing:-.02em}
header p{margin:0;opacity:.8;font-size:14px}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
h2{margin:0;font-size:18px}
.sub{color:var(--muted);font-size:13px}
.r{text-align:right}
.big{font-size:30px;font-weight:800;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;align-items:center}
.row.best{border-color:var(--best);background:var(--bestbg)}
.row.off{opacity:.55}
.row a{color:inherit;font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
.row b{font-variant-numeric:tabular-nums}
.d{display:block;font-size:12px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;color:var(--best)}
.card p.sub{margin:12px 0 0}
footer{max-width:640px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:13px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap">
<h1>PlayStation 5: dove costa meno</h1>
<p id="agg">Caricamento…</p>
</div></header>
<main id="app"></main>
<footer>Prezzi letti in automatico dalle pagine dei negozi, ogni 6 ore. Controlla sempre il prezzo finale sul sito del negozio prima di acquistare.</footer>
<script>
var NEGOZI=["Amazon","MediaWorld","Unieuro","Euronics"];
var MODELLI=[
{nome:"PS5 Digital Edition",listino:599.99,link:{MediaWorld:"https://www.mediaworld.it/it/product/_sony-ps5-dig-e-chassis-825gb-white-528663.html",Unieuro:"https://www.unieuro.it/online/Console-Playstation-5/PlayStation-5-Digital-Edition-pidSON1000049749"}},
{nome:"PS5 Slim con lettore",listino:649.99,link:{MediaWorld:"https://www.mediaworld.it/it/product/_sony-ps5-disc-e-chassis-white-528652.html"}},
{nome:"PS5 Pro",listino:899.99,link:{MediaWorld:"https://www.mediaworld.it/it/product/_sony-playstation-5-pro-2tb-white-548489.html",Unieuro:"https://www.unieuro.it/online/Console-Playstation-5/PlayStation-5-Pro-pidSON1000050720"}}
];
var VALIDITA=72*3600*1000;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function eur(n){return n.toLocaleString("it-IT",{style:"currency",currency:"EUR"})}
function ts(s){return Date.parse(s+(/[zZ]$|[+-]\d\d:?\d\d$/.test(s)?"":"Z"))}
function draw(st){
  var app=document.getElementById("app"),now=Date.now(),ultimo=0;
  app.textContent="";
  MODELLI.forEach(function(m){
    var dati=st[m.nome]||{},prezzi={},minimo=null;
    NEGOZI.forEach(function(n){
      var s=dati[n]||[];
      s.forEach(function(p){if(typeof p[1]==="number"&&(!minimo||p[1]<minimo.p))minimo={p:p[1],n:n,d:p[0]}});
      var l=s[s.length-1];
      if(l&&typeof l[1]==="number"){var t=ts(l[0]);if(now-t<=VALIDITA){prezzi[n]=l[1];if(t>ultimo)ultimo=t}}
    });
    var ok=Object.keys(prezzi).sort(function(a,b){return prezzi[a]-prezzi[b]});
    var best=ok[0],multi=ok.length>1;
    var c=el("section","card"),top=el("div","top"),l=el("div"),r=el("div");
    l.appendChild(el("h2",0,m.nome));
    l.appendChild(el("div","sub","Listino "+eur(m.listino)));
    r.appendChild(el("div","big",best?eur(prezzi[best]):"—"));
    var sotto=best?"su "+best+(prezzi[best]<m.listino-0.5?", "+eur(m.listino-prezzi[best])+" sotto il listino":""):"nessun prezzo recente";
    r.appendChild(el("div","sub r",sotto));
    top.appendChild(l);top.appendChild(r);c.appendChild(top);
    NEGOZI.forEach(function(n){
      var p=prezzi[n],isBest=(n===best&&multi);
      var row=el("div","row"+(p==null?" off":"")+(isBest?" best":""));
      var a=el("div");
      if(m.link[n]){var k=el("a",0,n);k.href=m.link[n];k.rel="noopener";a.appendChild(k)}else{a.appendChild(el("span",0,n))}
      if(isBest)a.appendChild(el("span","tag","  Prezzo più basso"));
      var b=el("div","r");
      if(p==null){b.appendChild(el("span","sub","non rilevato"))}
      else{
        b.appendChild(el("b",0,eur(p)));
        var d=p-m.listino;
        b.appendChild(el("span","d",Math.abs(d)<0.5?"come il listino":(d<0?eur(-d)+" sotto":eur(d)+" sopra")));
      }
      row.appendChild(a);row.appendChild(b);c.appendChild(row);
    });
    if(minimo)c.appendChild(el("p","sub","Minimo registrato: "+eur(minimo.p)+" ("+minimo.n+", "+new Date(ts(minimo.d)).toLocaleDateString("it-IT")+")"));
    app.appendChild(c);
  });
  document.getElementById("agg").textContent=ultimo?"Ultimo aggiornamento: "+new Date(ultimo).toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"}):"In attesa del primo aggiornamento";
}
fetch("prices.json?t="+Date.now()).then(function(r){if(!r.ok)throw new Error("no");return r.json()}).then(draw).catch(function(){draw({})});
</script>
</body>
</html>
