name: Aggiorna prezzi
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python ps5_monitor.py
      - run: cp sito.html index.html
      - run: |
          git config user.name "prezzi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.json index.html
          git diff --cached --quiet || git commit -m "Aggiorna prezzi"
          git push
